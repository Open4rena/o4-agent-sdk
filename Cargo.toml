[workspace]
members = [
    "crates/o4-agent-protocol",
    "crates/o4-agent-sdk",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/open4rena/o4-agent-sdk"

[workspace.dependencies]
async-trait = "0.1"
futures-core = "0.3"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
