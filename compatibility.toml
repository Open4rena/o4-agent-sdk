# Compatibility between this SDK and the o4 runtime.
#
# This SDK speaks wire protocol v1 with the o4-agent-runtime binary. The
# fields below pin the exact runtime revision and version the SDK was built
# and verified against. Update them deliberately when the runtime changes.

# The o4 repository commit that provides the matching o4-agent-runtime binary.
runtime_commit = "323cb2baeb040b0630e518868d4357d33bea16bd"

# The o4 runtime version at that commit.
runtime_version = "0.2.25"

# The JSONL wire protocol version implemented by both sides.
protocol_version = 1

# Semver constraint the SDK applies to the runtime at handshake in addition to
# protocol and capability negotiation. It spans every 0.x runtime: o4's minor
# number moves when its patch number passes 99 (0.2.99 -> 0.3.0), not on a
# protocol change, so a per-minor ceiling only cut users off at each rollover.
# Protocol version and capabilities are the real compatibility checks; the
# floor keeps out runtimes older than protocol v1. Must equal
# `DEFAULT_RUNTIME_VERSION_REQUIREMENT` in crates/o4-agent-sdk/src/lib.rs.
runtime_version_requirement = ">=0.0.57, <1.0.0"
